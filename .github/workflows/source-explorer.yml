name: Dragonic Source Explorer

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Masukkan URL Website Target (contoh: https://example.com)'
        required: true
        type: string

jobs:
  explore:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 requests urllib3

    - name: Run Dragonic Crawler
      env:
        TARGET_URL: ${{ inputs.target_url }}
      run: |
        python crawler.py

    - name: Upload Artifacts (ZIP & Reports)
      uses: actions/upload-artifact@v4
      with:
        name: dragonic-explorer-output
        path: |
          output/
          source_report.html
          source_report.json
          website_source.zip
        retention-days: 7
